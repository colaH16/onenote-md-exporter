name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell smoke tests
        shell: pwsh
        run: ./tests/smoke.ps1
      - name: Run Markdown converter tests
        run: python3 -m unittest tests/test_markdown_converter.py
